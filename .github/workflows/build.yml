name: Build Search-Logger Plugin

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PHP-Syntax prüfen
        run: |
          find ./Search-Logger/src -name "*.php" -exec php -l {} \;

      - name: Install shopware-cli
        uses: shopware/shopware-cli-action@v1
        with:
          version: 0.12.0

      - name: Build Extension
        run: shopware-cli extension zip ./Search-Logger --disable-git --verbose

      - name: Upload ZIP as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SearchLogger
          path: "*.zip"
